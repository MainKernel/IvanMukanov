openapi: 3.1.0

info:
  title: EventHub API
  version: 0.1.0
  description: Портал продажу квитків на події

servers:
  - url: http://localhost:4010
    description: Мок-сервер Prism
  - url: http://localhost:3000
    description: Локальний api-gateway

paths:
  /events:
    get:
      operationId: listEvents
      summary: Список подій із курсорною пагінацією
      tags: [catalog]
      parameters:
        - name: city
          in: query
          required: false
          description: Місто, у якому відбувається подія (точний збіг)
          schema:
            type: string
            examples: [Вінниця]
        - name: q
          in: query
          required: false
          description: >-
            Пошук за назвою події (підрядок, без урахування регістру).
            Порожній рядок рівнозначний відсутності параметра на клієнті —
            такий параметр не надсилається.
          schema:
            type: string
            minLength: 1
            maxLength: 100
            examples: [джаз]
        - name: from
          in: query
          required: false
          description: Показати події, що починаються не раніше цієї дати
          schema: { type: string, format: date }
        - name: cursor
          in: query
          required: false
          description: Непрозорий курсор із попередньої відповіді
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: Кількість подій на сторінці
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Сторінка подій
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
              examples:
                filled:
                  summary: Сторінка з подіями
                  value:
                    items:
                      - id: 018f2c1e-4a7b-7c3d-9e1f-2a5b6c7d8e9f
                        title: Симфонічний вечір
                        startsAt: "2026-10-12T19:00:00Z"
                        venue:
                          id: 018f2c1e-0000-7c3d-9e1f-2a5b6c7d8e00
                          name: Філармонія
                          city: Вінниця
                        minPrice: { amount: 25000, currency: UAH }
                        availableSeats: 143
                      - id: 018f2c1e-4a7b-7c3d-9e1f-2a5b6c7d8ea0
                        title: Джазовий квартет
                        startsAt: "2026-10-19T20:00:00Z"
                        venue:
                          id: 018f2c1e-0000-7c3d-9e1f-2a5b6c7d8e01
                          name: Клуб «Підвал»
                          city: Вінниця
                        minPrice: { amount: 18000, currency: UAH }
                        availableSeats: 12
                    nextCursor: "MjAyNi0xMC0xOVQyMDowMDowMFo"
                empty:
                  summary: Порожній каталог
                  value:
                    items: []
                    nextCursor: null
        "400":
          $ref: "#/components/responses/BadRequest"

  /events/{eventId}:
    get:
      operationId: getEvent
      summary: Одна подія
      tags: [catalog]
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Подія
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
              examples:
                default:
                  value:
                    id: 018f2c1e-4a7b-7c3d-9e1f-2a5b6c7d8e9f
                    title: Симфонічний вечір
                    description: Програма з творів Лисенка та Дворжака
                    startsAt: "2026-10-12T19:00:00Z"
                    venue:
                      id: 018f2c1e-0000-7c3d-9e1f-2a5b6c7d8e00
                      name: Філармонія
                      city: Вінниця
                    minPrice: { amount: 25000, currency: UAH }
                    availableSeats: 143
        "404":
          $ref: "#/components/responses/NotFound"

  # ============================================================================
  # ОБРАНЕ (Домашнє завдання ЛР №4)
  #
  # До тижня 5 (автентифікація) обране одне на весь застосунок і зберігається
  # у пам'яті api-gateway. Після появи користувача шляхи стануть
  # /me/favorites, а контракт відповіді не зміниться.
  #
  # PUT і DELETE ідемпотентні: повторне додавання/видалення — той самий 204.
  # Саме тому для оптимістичного оновлення на клієнті не потрібен POST-toggle:
  # клієнт завжди каже, який стан хоче, а не «переключи».
  # ============================================================================
  /favorites:
    get:
      operationId: listFavorites
      summary: Ідентифікатори обраних подій
      tags: [favorites]
      responses:
        "200":
          description: Обрані події
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteList"
              examples:
                default:
                  value:
                    eventIds: [018f2c1e-4a7b-7c3d-9e1f-2a5b6c7d8e9f]
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /favorites/{eventId}:
    parameters:
      - name: eventId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: addFavorite
      summary: Додати подію в обране (ідемпотентно)
      tags: [favorites]
      responses:
        "204":
          description: Подія в обраному
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: removeFavorite
      summary: Прибрати подію з обраного (ідемпотентно)
      tags: [favorites]
      responses:
        "204":
          description: Події немає в обраному
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ============================================================================
  # ЗАМОВЛЕННЯ (Домашнє завдання ЛР №2)
  #
  # Письмове обґрунтування вибору HTTP-кодів помилок:
  #
  # 1. Місце вже утримує інший покупець (або вільних місць зараз недостатньо):
  #    -> 409 Conflict (#/components/responses/OrderConflict).
  #    Чому 409: Запит синтаксично коректний і клієнт має право купувати квитки,
  #    але операція конфліктує з поточним динамічним станом ресурсу (місце
  #    тимчасово заблоковане іншим покупцем на час резерву).
  #    Чи має сенс повторити запит через хвилину? ТАК: якщо інший покупець
  #    не завершить оплату або скасує бронь, місце звільниться і повторний
  #    запит пройде успішно.
  #
  # 2. Подія скасована організатором:
  #    -> 422 Unprocessable Content (#/components/responses/EventCancelled).
  #    Чому 422: Формат і типи полів запиту валідні (тому не 400), ресурс події
  #    існує (тому не 404), але бізнес-правило домену забороняє створювати
  #    замовлення на подію в термінальному стані "cancelled".
  #    Чи має сенс повторити запит через хвилину? НІ: скасування події є
  #    незворотним бізнес-рішенням, повтор запиту нічого не змінить.
  #
  # 3. Користувач намагається скасувати чуже замовлення:
  #    -> 403 Forbidden (#/components/responses/Forbidden).
  #    Чому 403: Сервер розуміє, хто робить запит (buyerId відомий), але цей
  #    суб'єкт не є власником замовлення й не має повноважень на його зміну.
  #    Чи має сенс повторити запит через хвилину? НІ: без зміни облікового
  #    запису / прав доступу повтор того самого запиту завжди повертатиме 403.
  #
  # Чим ці три випадки відрізняються з погляду клієнта (фронтенду):
  # - При 409 клієнту варто запропонувати кнопку «Спробувати ще раз» або оновити
  #   схему залу.
  # - При 422 кнопку покупки треба заблокувати й показати плашку «Подію скасовано».
  # - При 403 показати повідомлення про відсутність прав доступу без ретраїв.
  # ============================================================================
  /orders:
    post:
      operationId: createOrder
      summary: Створити замовлення на подію
      tags: [orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
            examples:
              default:
                summary: Замовлення двох квитків
                value:
                  eventId: 018f2c1e-4a7b-7c3d-9e1f-2a5b6c7d8e9f
                  buyerId: 018f2c1e-9999-7c3d-9e1f-2a5b6c7d8e11
                  quantity: 2
      responses:
        "201":
          description: Замовлення створено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
              examples:
                created:
                  summary: Нове замовлення в очікуванні оплати
                  value:
                    id: 018f2c1e-7777-7c3d-9e1f-2a5b6c7d8e55
                    eventId: 018f2c1e-4a7b-7c3d-9e1f-2a5b6c7d8e9f
                    buyerId: 018f2c1e-9999-7c3d-9e1f-2a5b6c7d8e11
                    quantity: 2
                    total: { amount: 50000, currency: UAH }
                    status: pending
                    createdAt: "2026-10-01T12:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/OrderConflict"
        "422":
          $ref: "#/components/responses/EventCancelled"

  /orders/{orderId}:
    get:
      operationId: getOrder
      summary: Переглянути замовлення за ідентифікатором
      tags: [orders]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Деталі замовлення
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
              examples:
                default:
                  value:
                    id: 018f2c1e-7777-7c3d-9e1f-2a5b6c7d8e55
                    eventId: 018f2c1e-4a7b-7c3d-9e1f-2a5b6c7d8e9f
                    buyerId: 018f2c1e-9999-7c3d-9e1f-2a5b6c7d8e11
                    quantity: 2
                    total: { amount: 50000, currency: UAH }
                    status: pending
                    createdAt: "2026-10-01T12:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          # Чуже замовлення також повертає 404, а не 403 (ДЗ ЛР №5),
          # щоб не видавати сам факт існування чужого замовлення.
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: cancelOrder
      summary: Скасувати замовлення
      tags: [orders]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: buyerId
          in: query
          required: true
          description: Ідентифікатор покупця, який ініціює скасування (до появи повноцінної JWT-автентифікації)
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Замовлення скасовано
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
              examples:
                cancelled:
                  value:
                    id: 018f2c1e-7777-7c3d-9e1f-2a5b6c7d8e55
                    eventId: 018f2c1e-4a7b-7c3d-9e1f-2a5b6c7d8e9f
                    buyerId: 018f2c1e-9999-7c3d-9e1f-2a5b6c7d8e11
                    quantity: 2
                    total: { amount: 50000, currency: UAH }
                    status: cancelled
                    createdAt: "2026-10-01T12:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/OrderConflict"

  # ============================================================================
  # АВТЕНТИФІКАЦІЯ (Лабораторна робота №5 + ДЗ №1)
  # ============================================================================
  /auth/register:
    post:
      operationId: register
      summary: Реєстрація нового користувача
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Користувача створено; refresh-токен встановлено у httpOnly-cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/EmailTaken"

  /auth/login:
    post:
      operationId: login
      summary: Вхід за поштою та паролем
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Успішний вхід; refresh-токен встановлено у httpOnly-cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          # Однакова відповідь і на «немає такої пошти», і на «невірний пароль»
          $ref: "#/components/responses/InvalidCredentials"

  /auth/refresh:
    post:
      operationId: refresh
      summary: Ротація refresh-токена (з httpOnly-cookie) та видача нового access-токена
      tags: [auth]
      responses:
        "200":
          description: Новий access-токен; новий refresh-токен встановлено у httpOnly-cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "401":
          $ref: "#/components/responses/InvalidRefreshToken"

  /auth/logout:
    post:
      operationId: logout
      summary: Вихід із поточної сесії (відкликання сімейства токенів та очищення cookie)
      tags: [auth]
      responses:
        "204":
          description: Сесію завершено

  /auth/logout-all:
    post:
      operationId: logoutAll
      summary: Вихід з усіх пристроїв поточного користувача (ДЗ ЛР №5)
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Усі refresh-токени користувача відкликано
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /auth/me:
    get:
      operationId: getMe
      summary: Профіль поточного автентифікованого користувача
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Поточний користувач (без passwordHash)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /auth/google:
    get:
      operationId: googleAuthStart
      summary: Початок входу через Google (OpenID Connect + PKCE + state + nonce)
      tags: [auth]
      responses:
        "302":
          description: Перенаправлення на сторінку згоди Google або на /login?oauthError=...

  /auth/google/link:
    post:
      operationId: prepareGoogleLink
      summary: Підготовка явного прив'язування Google-акаунта з особистого кабінету (ДЗ ЛР №6)
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: URL для переходу на Google OAuth у режимі прив'язування
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleLinkResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /auth/google/callback:
    get:
      operationId: googleAuthCallback
      summary: Завершення входу або прив'язування через Google (перевірка state, PKCE, id_token, nonce)
      tags: [auth]
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: false
          schema: { type: string }
        - name: error
          in: query
          required: false
          schema: { type: string }
      responses:
        "302":
          description: Перенаправлення на /me (успіх) або /login?oauthError=... (відмова)

  # ============================================================================
  # КАБІНЕТ ОРГАНІЗАТОРА ТА АДМІНІСТРУВАННЯ (Лабораторна робота №6 + ДЗ №3)
  # ============================================================================
  /organizer/events:
    get:
      operationId: listOrganizerEvents
      summary: Список подій поточного організатора (або всіх подій для ADMIN)
      tags: [organizer]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Події організатора
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizerEventList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      operationId: createOrganizerEvent
      summary: Створити нову подію (власник береться виключно з токена)
      tags: [organizer]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventRequest"
      responses:
        "201":
          description: Подію створено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/VenueNotFound"

  /organizer/events/{eventId}:
    patch:
      operationId: updateOrganizerEvent
      summary: Оновити власну подію (чужа подія повертає 404, а не 403)
      tags: [organizer]
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEventRequest"
      responses:
        "200":
          description: Подію оновлено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/VenueNotFound"

  /admin/users/{userId}/role:
    patch:
      operationId: updateUserRole
      summary: Зміна ролі користувача адміністратором (ДЗ ЛР №6)
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRoleRequest"
      responses:
        "200":
          description: Роль користувача оновлено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Event:
      type: object
      required: [id, title, startsAt, venue, minPrice, availableSeats]
      properties:
        id:          { type: string, format: uuid }
        title:       { type: string }
        description: { type: string }
        startsAt:    { type: string, format: date-time }
        venue:       { $ref: "#/components/schemas/VenueSummary" }
        minPrice:    { $ref: "#/components/schemas/Money" }
        availableSeats: { type: integer, minimum: 0 }
        cancelled:   { type: boolean }

    VenueSummary:
      type: object
      required: [id, name, city]
      properties:
        id:   { type: string, format: uuid }
        name: { type: string }
        city: { type: string }

    Money:
      type: object
      required: [amount, currency]
      description: Сума в мінімальних одиницях валюти (копійках)
      properties:
        amount:   { type: integer }
        currency: { type: string, enum: [UAH] }

    EventPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Event" }
        nextCursor:
          type: [string, "null"]
          description: Курсор наступної сторінки; null — сторінок більше немає

    FavoriteList:
      type: object
      required: [eventIds]
      properties:
        eventIds:
          type: array
          items: { type: string, format: uuid }

    CreateOrderRequest:
      type: object
      required: [eventId, buyerId, quantity]
      properties:
        eventId:  { type: string, format: uuid }
        buyerId:  { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 10 }

    OrderStatus:
      type: string
      enum: [pending, cancelled]

    Order:
      type: object
      required: [id, userId, eventId, buyerId, quantity, total, status, createdAt]
      properties:
        id:        { type: string, format: uuid }
        userId:    { type: string, format: uuid }
        eventId:   { type: string, format: uuid }
        buyerId:   { type: string, format: uuid }
        quantity:  { type: integer, minimum: 1, maximum: 10 }
        total:     { $ref: "#/components/schemas/Money" }
        status:    { $ref: "#/components/schemas/OrderStatus" }
        createdAt: { type: string, format: date-time }

    Role:
      type: string
      enum: [USER, ORGANIZER, ADMIN]

    User:
      type: object
      required: [id, email, role, createdAt]
      properties:
        id:           { type: string, format: uuid }
        email:        { type: string, format: email, maxLength: 254 }
        role:         { $ref: "#/components/schemas/Role" }
        createdAt:    { type: string, format: date-time }
        googleLinked: { type: boolean }

    GoogleLinkResponse:
      type: object
      required: [url]
      properties:
        url: { type: string }

    OrganizerEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Event" }

    CreateEventRequest:
      type: object
      required: [title, startsAt, venueId, minPriceCents]
      properties:
        title:          { type: string, minLength: 1, maxLength: 200 }
        description:    { type: string, maxLength: 2000 }
        startsAt:       { type: string, format: date-time }
        venueId:        { type: string, format: uuid }
        minPriceCents:  { type: integer, minimum: 0 }
        availableSeats: { type: integer, minimum: 0, default: 80 }

    UpdateEventRequest:
      type: object
      properties:
        title:          { type: string, minLength: 1, maxLength: 200 }
        description:    { type: string, maxLength: 2000 }
        startsAt:       { type: string, format: date-time }
        venueId:        { type: string, format: uuid }
        minPriceCents:  { type: integer, minimum: 0 }
        availableSeats: { type: integer, minimum: 0 }

    UpdateUserRoleRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/Role" }

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:    { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 10, maxLength: 128 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:    { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128 }

    AuthResponse:
      type: object
      required: [accessToken, user]
      properties:
        accessToken: { type: string }
        user:        { $ref: "#/components/schemas/User" }

    RefreshResponse:
      type: object
      required: [accessToken]
      properties:
        accessToken: { type: string }

    Problem:
      type: object
      description: RFC 9457 Problem Details
      required: [type, title, status]
      properties:
        type:     { type: string }
        title:    { type: string }
        status:   { type: integer }
        detail:   { type: string }
        instance: { type: string }

  responses:
    BadRequest:
      description: Некоректні параметри запиту
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            invalidLimit:
              value:
                type: /errors/invalid-query
                title: Некоректний параметр запиту
                status: 400
                detail: "Параметр limit має бути в межах 1..50"

    Forbidden:
      description: Доступ заборонено (спроба змінити або скасувати чуже замовлення)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            foreignOrder:
              value:
                type: /errors/forbidden-order-access
                title: Доступ до замовлення заборонено
                status: 403
                detail: "Ви не можете скасувати замовлення іншого покупця"

    NotFound:
      description: Ресурс не знайдено
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            eventNotFound:
              value:
                type: /errors/not-found
                title: Подію не знайдено
                status: 404
            orderNotFound:
              value:
                type: /errors/order-not-found
                title: Замовлення не знайдено
                status: 404

    OrderConflict:
      description: Конфлікт стану ресурсу (місце вже утримується іншим покупцем або замовлення вже скасовано)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            seatHeldByAnotherBuyer:
              value:
                type: /errors/seat-already-held
                title: Місця вже утримуються іншим покупцем
                status: 409
                detail: "Обрана кількість місць зараз недоступна через активне бронювання іншого покупця. Спробуйте через хвилину."
            alreadyCancelled:
              value:
                type: /errors/order-already-cancelled
                title: Замовлення вже скасовано
                status: 409
                detail: "Це замовлення вже перебуває у статусі cancelled"

    ServiceUnavailable:
      description: Сервіс тимчасово недоступний — запит можна повторити
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            favoritesUnavailable:
              value:
                type: /errors/favorites-unavailable
                title: Не вдалося оновити обране
                status: 503
                detail: "Сервіс обраного тимчасово недоступний. Спробуйте ще раз."

    EventCancelled:
      description: Операція неможлива за бізнес-правилами (подію скасовано організатором)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            eventCancelledByOrganizer:
              value:
                type: /errors/event-cancelled
                title: Подію скасовано організатором
                status: 422
                detail: "Продаж квитків припинено, оскільки організатор скасував подію"

    InvalidCredentials:
      description: Невірна пошта або пароль (однакова відповідь для обох випадків)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            invalidCredentials:
              value:
                type: /errors/invalid-credentials
                title: Невірна пошта або пароль
                status: 401
                detail: "Перевірте введену пошту та пароль"

    Unauthenticated:
      description: Відсутній або недійсний access-токен
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            unauthenticated:
              value:
                type: /errors/unauthenticated
                title: Потрібна автентифікація
                status: 401
                detail: "Надайте дійсний Bearer-токен у заголовку Authorization"

    InvalidRefreshToken:
      description: Refresh-токен відсутній, протермінований, відкликаний або використаний повторно
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            invalidRefresh:
              value:
                type: /errors/invalid-refresh-token
                title: Сесія недійсна або завершена
                status: 401
                detail: "Увійдіть у систему заново"

    EmailTaken:
      description: Користувач із такою поштою вже існує
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            emailTaken:
              value:
                type: /errors/email-taken
                title: Ця пошта вже зареєстрована
                status: 409
                detail: "Спробуйте увійти або вкажіть іншу адресу електронної пошти"

    VenueNotFound:
      description: Майданчик, вказаний у тілі запиту, не існує
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            venueNotFound:
              value:
                type: /errors/venue-not-found
                title: Майданчик не знайдено
                status: 422
                detail: "Вказаний venueId не існує в базі даних"
